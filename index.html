<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#061425" />
<title>PEAK IRONY — Interactive Covers + Merchandise Collection Test</title>
<style>
:root{color-scheme:dark;--bg:#061425;--gold:#f1c64a;--white:#f5f4ef;--muted:#b5c3cf;--red:#d6333e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17496d 0,#07182b 44%,#061425 100%);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:10;background:#061425f2;border-bottom:1px solid #395068;backdrop-filter:blur(16px);padding:10px 12px}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}.brand{text-decoration:none;font-weight:1000;letter-spacing:.06em;font-size:21px;white-space:nowrap}.brand strong{color:#ee3b39}.tools{display:flex;flex-wrap:wrap;gap:6px}.btn{padding:9px 12px;border:1px solid #667c8e;color:#fff;background:#122f49;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px;justify-content:center}.btn:hover,.btn:focus-visible{border-color:var(--gold);background:#264f71}.btn.primary{background:#ba242d;border-color:#e36d72}.btn.active{background:#bd8730;border-color:#ffd76c;color:#051323}.btn:focus-visible,a:focus-visible{outline:3px solid #ffe066;outline-offset:2px}
main{padding:22px 12px 65px}.shell{max-width:1120px;margin:auto}.cover-layout{display:grid;grid-template-columns:minmax(0,610px) minmax(210px,1fr);gap:22px;align-items:start}.cover-shell{width:100%;margin:auto;position:relative;overflow:hidden;border-radius:7px;border:1px solid #4f718a;box-shadow:0 16px 50px #000a;background:#030a14}.cover-art{width:100%;height:auto;display:block}.hotspots{position:absolute;inset:0;height:100%;width:100%}.hotspot rect{fill:#fff;fill-opacity:0;stroke:transparent;stroke-width:4;transition:fill-opacity .13s,stroke .13s}.hotspot:hover rect,.hotspot:focus rect{fill:#ffdd4d;fill-opacity:.18;stroke:#ffe46d}.show-zones .hotspot rect{fill:#fff7ac;fill-opacity:.055;stroke:#ffdf60;stroke-width:3}.show-zones .hotspot:hover rect{fill:#ffe46d;fill-opacity:.3}.hotspot{cursor:pointer}.hotspot text{display:none;pointer-events:none}
.kicker{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.aside{border:1px solid #304b5c;border-radius:13px;background:#071b31;padding:18px;box-shadow:0 15px 45px #0005}.aside h1{font-size:clamp(21px,3vw,27px);line-height:1.12;margin:8px 0}.aside p{line-height:1.48;color:#d0d8de;font-size:14px}.asidemenu{display:flex;flex-direction:column;gap:6px;max-height:450px;overflow:auto;padding:5px 1px}.linkrow{display:flex;justify-content:space-between;gap:8px;border:1px solid #314b5d;background:#112d45;border-radius:8px;text-decoration:none;padding:9px 10px;font-size:13px}.linkrow:hover,.linkrow:focus-visible{border-color:#f0c13d;background:#194869}.small{font-size:12px;color:#b9c8d5}.tip{border-left:3px solid #ecc13d;padding-left:10px}
.pageview{max-width:700px;margin:3vh auto 0;border:1px solid #41556a;padding:clamp(22px,6vw,50px);min-height:350px;background:linear-gradient(145deg,#11304c,#071425);border-radius:17px;text-align:center;box-shadow:0 19px 65px #0007}.pageview h1{font-size:clamp(30px,6vw,56px);line-height:1.07;margin:28px auto 18px;overflow-wrap:anywhere}.pageview .note{color:var(--muted);font-size:15px;line-height:1.6}.backactions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px 0}.slug{color:#bfcbd4;word-break:break-word;font-family:monospace;font-size:11px}.otherlink{margin-top:22px}
footer{color:#acbdc9;text-align:center;margin:22px auto 0;padding:0 12px;font-size:12px}.hidden{display:none!important}

.collection{max-width:1120px;margin:28px auto 0;background:#071b31e8;border:1px solid #405a70;border-radius:14px;padding:clamp(16px,3vw,26px)}
.collectionhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.collection h2{font-size:clamp(24px,4vw,36px);line-height:1.1;margin:7px 0}.collection p{color:#bed0dc;line-height:1.45;margin:6px 0 17px;font-size:14px}
.merchgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.merchcard{min-width:0;display:flex;flex-direction:column;gap:10px;padding:15px;border:1px solid #45637a;background:#122e47;border-radius:12px;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.merchcard:hover,.merchcard:focus-visible{background:#204865;border-color:var(--gold);transform:translateY(-2px)}.merchcard .pict{display:flex;align-items:center;justify-content:center;background:#071b31;border:1px dashed #607d8e;border-radius:9px;min-height:86px;font-size:46px;line-height:1}.merchcard b{font-size:17px;color:white}.merchcard .mini{font-size:12px;color:#bdcbd6;line-height:1.4;flex:1}.merchcard .next{color:#f0cc70;font-size:12px;font-weight:800}
.flowline{margin-top:22px;padding:14px 16px;border:1px dashed #6e7e89;background:#081726;border-radius:10px}.flowline h3{margin:0 0 6px;font-size:15px}.flowline p{font-size:13px;margin:0;line-height:1.5}.shopwrap{max-width:1000px;margin:0 auto}.shopintro{font-size:15px;line-height:1.5;color:#c0d2df;max-width:750px}.productpage{max-width:720px;margin:20px auto;padding:clamp(22px,5vw,38px);border-radius:16px;border:1px solid #4d6b84;background:linear-gradient(135deg,#153652,#071b2c)}.productpage .pict{font-size:64px}.productpage h1{font-size:clamp(31px,5vw,50px);margin:5px 0}.productpage p{font-size:16px;line-height:1.55;color:#c3d0d9}.status{display:inline-block;font-size:12px;background:#303a42;border:1px solid #77818a;color:#eee;padding:5px 9px;border-radius:100px}.emptycart{margin:20px 0;padding:18px;background:#081828;border:1px dashed #6e7e89;border-radius:12px}
@media(max-width:650px){.merchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.merchcard{padding:10px}.merchcard .pict{min-height:65px;font-size:39px}}
@media(max-width:360px){.merchgrid{grid-template-columns:1fr}}

@media(max-width:780px){.cover-layout{grid-template-columns:1fr}.aside{max-width:610px;margin:auto;width:100%}.asidemenu{max-height:260px}.bar{justify-content:center}.brand{font-size:19px}main{padding:11px 7px 50px}.cover-shell{border-radius:3px}.pageview{margin:20px 8px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* Editor styles */
.edit-mode .pageview, .edit-mode .productpage { border: 2px dashed var(--gold); }
.editor-panel { position:fixed; top:70px; right:12px; width:320px; max-height:80vh; overflow:auto; background:#071b31; border:1px solid var(--gold); border-radius:12px; padding:14px; z-index:100; box-shadow:0 10px 40px #0008; }
.editor-panel h3 { margin:0 0 10px; font-size:16px; }
.editor-panel label { display:block; font-size:12px; margin:8px 0 3px; color:var(--gold); }
.editor-panel input, .editor-panel textarea, .editor-panel select { width:100%; padding:8px; border-radius:6px; border:1px solid #45637a; background:#122e47; color:#fff; font:inherit; }
.editor-panel textarea { min-height:80px; }
.editor-panel .btn { margin-top:8px; width:100%; }
.edit-toggle { background:#2a5a3a !important; }

</style>
